name: 政策库自动监控

on:
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC = 北京 10:00
  workflow_dispatch: {}   # 支持在 Actions 页手动触发

permissions:
  contents: write         # 自动写回 policies.json(归档)/policies_archived.json/policies_draft.json/monitor_state.json/monitor_changelog.md

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行自动监控
        run: node .github/scripts/monitor_policies.js

      - name: 提交自动巡检结果
        run: |
          git config user.name "policy-bot[bot]"
          git config user.email "policy-bot@users.noreply.github.com"
          git add policies.json policies_archived.json policies_draft.json monitor_state.json monitor_changelog.md
          if ! git diff --cached --quiet; then
            git commit -m "bot: 自动巡检归档失效/过期政策 + 采集新政草稿"
            git push
          else
            echo "无变更，跳过提交"
          fi
