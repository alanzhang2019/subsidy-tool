<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>补贴诊断报告</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .report{max-width:820px;margin:0 auto}
  .r-head{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:16px;padding:28px 32px;margin-bottom:20px}
  .r-head h1{font-size:22px}
  .r-head .meta{opacity:.9;font-size:13px;margin-top:8px}
  .r-sec{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px}
  .r-sec h3{font-size:15px;border-left:4px solid var(--primary);padding-left:10px;margin-bottom:12px}
  .kv{font-size:14px;color:#333;line-height:2}
  .kv b{display:inline-block;min-width:96px;color:#666}
  .total-big{font-size:26px;font-weight:800;color:var(--primary)}
  .r-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .r-row .l{font-size:14px}
  .r-row .l .s{font-size:12px;color:#888;margin-top:3px}
  .r-row .r{text-align:right;white-space:nowrap}
  .st{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
  .st.ok{background:#e6f6ee;color:var(--ok)} .st.gap{background:#fdf4e0;color:var(--warn)}
  .toolbar{max-width:820px;margin:0 auto 16px;display:flex;gap:10px}
  .toolbar .btn{width:auto;padding:10px 18px}
  .err{text-align:center;color:var(--muted);padding:60px 20px}
  @media print{.toolbar{display:none}.r-head,.r-sec{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar" id="toolbar" style="display:none">
    <button class="btn" onclick="window.print()">打印 / 存为 PDF</button>
  </div>
  <div id="content"></div>
  <footer>深圳补贴匹配自测工具 · 本报告由系统依据公开政策自动测算，数据仅在本地浏览器生成 · © 2026</footer>
</div>
<script src="js/engine.js"></script>
<script src="js/report.js"></script>
</body>
</html>
